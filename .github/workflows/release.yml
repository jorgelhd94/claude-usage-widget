name: Release (Windows)

# Push a version tag to build the installer and publish a GitHub Release:
#   git tag v0.1.0 && git push origin v0.1.0
# Or run it manually from the Actions tab (uploads the installer as a run artifact).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed so tauri-action can create/upload the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # When triggered by a tag, create a draft GitHub Release with the
          # installer attached. On manual runs (no tag) this is empty, so the
          # action only builds (no release) — the artifact upload below covers it.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Claude Usage Widget {0}', github.ref_name) || '' }}
          releaseBody: "Download the `*-setup.exe` below to install. Windows SmartScreen may warn about an unsigned app — choose *More info → Run anyway*."
          releaseDraft: true
          prerelease: false

      - name: Upload installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: claude-usage-widget-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
