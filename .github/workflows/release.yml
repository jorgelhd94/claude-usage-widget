name: Release (Windows)

# Push a version tag to build the installer and publish a GitHub Release:
#   git tag v0.1.0 && git push origin v0.1.0
# Or run it manually from the Actions tab (uploads the installer as a run artifact).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed so the release step can create/upload the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Build only (no release here) — Tauri derives the installer name from
      # productName, which contains spaces; we tidy it up in the next step.
      - name: Build app
        uses: tauri-apps/tauri-action@v0

      # Tauri names the installer "Claude Usage Widget_<v>_x64-setup.exe".
      # Strip the spaces so the file reads consistently: ClaudeUsageWidget_<v>_x64-setup.exe
      - name: Tidy installer filename
        shell: pwsh
        run: |
          $f = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $f) { throw "No NSIS installer found" }
          $clean = $f.Name -replace ' ', ''
          if ($clean -ne $f.Name) { Rename-Item -LiteralPath $f.FullName -NewName $clean }
          Write-Host "Installer: $clean"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-usage-widget-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # Only when triggered by a version tag: publish a draft GitHub Release
      # with the tidied installer attached.
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Claude Usage Widget ${{ github.ref_name }}
          body: "Download the `*-setup.exe` below to install. Windows SmartScreen may warn about an unsigned app — choose *More info → Run anyway*."
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
